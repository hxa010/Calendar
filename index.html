<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <title>Appointment Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>My Appointments</h1>

  <form id="appointment-form">
    <input type="text" id="title" placeholder="Title" required />
    <input type="datetime-local" id="datetime" required />
    <input type="text" id="location" placeholder="Location" required />
    <button type="submit">Add Appointment</button>
  </form>

  <div class="filter-bar">
    <input type="text" id="filter-input" placeholder="Filter by keyword..." />
  </div>

  <div class="bulk-upload">
    <h2>Upload Preferred Locations</h2>
    <textarea id="location-upload" rows="4" placeholder="One location per line..."></textarea>
    <button id="generate-weekly">Auto-Schedule This Week</button>
  </div>

  <ul id="appointment-list"></ul>

  <script src="app.js"></script>
</body>
</html>
